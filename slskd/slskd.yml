# permissions:
#    file:
#     mode: 777 # not for Windows, chmod syntax, e.g. 644, 777. can't escalate beyond umask
 directories:
   incomplete: /app/incomplete
   downloads: /app/downloads
 shares:
   directories:
     - /music
   filters:
     - \.ini$
     - Thumbs.db$
     - \.DS_Store$
     - \.artoverride.txt
   cache:
     storage_mode: disk
     workers: 6
     retention: 1440
# rooms:
#   - ~
 transfers:
   download:
     destination:
       permissions:
         mode: 777
     retry:
       #incomplete: resume
       attempts: 3
       delay: 5000
       max_delay: 60000
   upload:
     slots: 20
     speed_limit: 5000 # in kibibytes
#     limits:
#       queued:
#         files: 500
#         megabytes: 5000
#       daily:
#         files: 1000
#         megabytes: 10000
#         failures: 200
#       weekly:
#         files: 5000
#         megabytes: 50000
#         failures: 1000
#   download:
#     slots: 500
#     speed_limit: 1000
   groups:
     default:
       upload:
         priority: 500
         strategy: roundrobin
         slots: 10
         limits:
           queued:
             files: 150
             megabytes: 1500
           daily: ~ # no daily limits (weekly still apply)
           weekly:
             files: 1500
             megabytes: 15000
             failures: 150
     leechers:
       thresholds:
         files: 1
         directories: 1
       upload:
         priority: 999
         strategy: roundrobin
         slots: 1
         speed_limit: 100
         limits:
           queued:
             files: 15
             megabytes: 150
           daily:
             files: 30
             megabytes: 300
             failures: 10
           weekly:
             files: 150
             megabytes: 1500
             failures: 30
     blacklisted:
       members:
#       cidrs:
#         - <CIDR to blacklist, e.g. 255.255.255.255/32>
     user_defined:
       my_buddies:
         upload:
           priority: 250
           strategy: firstinfirstout
           slots: 10
           limits:
             queued:
               files: 1000 # override global default
         members:
           - LiaMielle
# blacklist:
#   enabled: true
#   file: <path to file containing CIDRs to blacklist>
# filters:
#   search:
#     request:
#       - ^.{1,2}$
 web:
   port: 5030
#   ip_address: 0.0.0.0,[::]
   socket: ~
   https:
     disabled: true
     port: 5031
     ip_address: 0.0.0.0,[::]
     force: false
     certificate:
       pfx: ~
       password: ~
   url_base: /
   content_path: wwwroot
   logging: false
   authentication:
     disabled: false
     jwt:
       key: ~
       ttl: 604800000
     api_keys:
       my_api_key:
         key: SoulSyncAPIKeyNumber1
         role: readonly # readonly, readwrite, administrator
         cidr: 0.0.0.0/0,::/0
 retention:
   search: 10080 # 7 days, in minutes
#   transfers:
#     upload:
#       succeeded: 1440 # 1 day, in minutes
#       errored: 30
#       cancelled: 5
#       failed: 180 # any unsuccessful transfer, including errored and cancelled
#   download:
#     succeeded: 1440 # 1 day, in minutes
#     errored: 20160 # 2 weeks, in minutes
#     cancelled: 5
#     failed: 180 # any unsuccessful transfer, including errored and cancelled
   files:
     incomplete: 2880 # 30 days, in minutes
#     complete: 20160 # 2 weeks, in minutes
